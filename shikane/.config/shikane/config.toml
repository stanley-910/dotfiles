# ==============================================================================
# Shikane Display Configuration
# ==============================================================================
# Auto-generated profiles for different display setups.
# Shikane automatically detects connected displays and applies matching profiles.
#
# To add new profiles:
#   1. Arrange displays using nwg-displays GUI
#   2. Run: shikanectl export >> ~/.config/shikane/config.toml
#   3. Edit the profile name and clean up duplicates
#
# Profiles are matched by connected displays. The most specific match wins.
# ==============================================================================

# ------------------------------------------------------------------------------
# Profile 1: Laptop Only (Portable Mode)
# ------------------------------------------------------------------------------
# When: Only laptop screen is connected (no external monitors)
# Use case: Working on the go, battery-powered, traveling
[[profile]]
name = "laptop-only"
    
    [[profile.output]]
    search = "eDP-1"                    # Built-in laptop display
    enable = true
    mode = "1920x1080@60Hz"
    position = "0,0"
    scale = 1.0

# ------------------------------------------------------------------------------
# Profile 2: Docked Mode (Laptop Closed)
# ------------------------------------------------------------------------------
# When: External monitors connected, laptop lid closed
# Use case: Desk setup with laptop in clamshell mode
# Note: This disables the laptop screen for maximum performance on externals
[[profile]]
name = "docked-clamshell"
    
    # Laptop screen - DISABLED when docked
    [[profile.output]]
    search = "eDP-1"
    enable = false
    
    # ASUS VG249 - LEFT monitor (vertical, 120Hz)
    [[profile.output]]
    search = ["n=DP-2", "s=SCLMTF105933"]      # Match by name AND serial
    enable = true
    mode = "1920x1080@120Hz"
    position = "0,0"                            # Leftmost position
    scale = 1.0
    transform = "90"                            # Vertical orientation (90° clockwise = 1080 wide x 1920 tall)
    
    # LG UltraGear - Main center/right monitor (1440p)
    [[profile.output]]
    search = ["n=HDMI-A-1", "s=409MXCR5B443"]  # Match by name AND serial
    enable = true
    mode = "2560x1440@59.95Hz"
    position = "1080,0"                         # Right of DP-2 (vertical width is 1080)
    scale = 1.0
    # adaptive_sync = true                      # Uncomment for gaming (VRR)

# ------------------------------------------------------------------------------
# Profile 3: Extended Desktop (Laptop + Externals)
# ------------------------------------------------------------------------------
# When: External monitors connected, laptop lid open
# Use case: Maximum screen real estate, laptop as additional display
# Note: Laptop screen stays enabled for 3-monitor setup
# Layout: [DP-2 Vertical] [LG Center] [Laptop Right]
[[profile]]
name = "extended-triple"
    
    # ASUS VG249 - LEFT monitor (vertical, 120Hz)
    [[profile.output]]
    search = ["n=DP-2", "s=SCLMTF105933"]
    enable = true
    mode = "1920x1080@120Hz"
    position = "0,0"                            # Leftmost position
    scale = 1.0
    transform = "90"                            # Vertical orientation (1080 wide x 1920 tall)
    
    # LG UltraGear - CENTER monitor (1440p)
    [[profile.output]]
    search = ["n=HDMI-A-1", "s=409MXCR5B443"]
    enable = true
    mode = "2560x1440@59.95Hz"
    position = "1080,0"                         # After DP-2 vertical (1080 wide)
    scale = 1.0
    
    # Laptop screen - RIGHT of LG monitor
    [[profile.output]]
    search = "eDP-1"
    enable = true
    mode = "1920x1080@60Hz"
    position = "3640,360"                       # After DP-2 + LG (1080+2560=3640), centered vertically
    scale = 1.0

# ==============================================================================
# Notes:
# ==============================================================================
# - Serial numbers ensure correct monitor matching (useful if you have 2 LGs)
# - Position coordinates form a left-to-right layout
# - Transform "90" = 90° clockwise, "270" = 90° counter-clockwise
# - adaptive_sync enables VRR/FreeSync for gaming (uncomment if needed)
# - Profile matching is deterministic - most specific profile wins
# - Shikane automatically switches profiles when displays connect/disconnect
# ==============================================================================
