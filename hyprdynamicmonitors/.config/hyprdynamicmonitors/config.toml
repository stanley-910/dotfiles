# ==============================================================================
# HyprDynamicMonitors Configuration
# ==============================================================================
# Automatic monitor profile switching based on connected displays and lid state.
# Replaces shikane with Hyprland-native monitor management.
#
# Profiles are matched by:
#   1. Required monitors being connected
#   2. Lid state (Opened/Closed) when using --enable-lid-events
#
# The most specific matching profile is applied automatically.
# ==============================================================================

[general]
# Output file that Hyprland sources for monitor configuration
# This file is auto-generated by HyprDynamicMonitors when profiles change
destination = "$HOME/.config/hypr/monitors.conf"

# Optional: Notify on profile changes (uncomment if you want notifications)
# post_apply_exec = "notify-send 'Monitor Profile' 'Configuration applied'"

# ==============================================================================
# Profile 1: Laptop Only (Portable Mode)
# ==============================================================================
# When: Only laptop screen connected, no external monitors
# Use case: Working on the go, traveling, meetings
[profiles.laptop_only]
config_file = "hyprconfigs/laptop.conf"
config_file_type = "static"

# Only requires the laptop display to be connected
[[profiles.laptop_only.conditions.required_monitors]]
name = "eDP-1"

# ==============================================================================
# Profile 2: Docked Clamshell (Lid Closed + External Monitors)
# ==============================================================================
# When: External monitors connected AND laptop lid is closed
# Use case: Desk setup with laptop closed, using only external displays
[profiles.docked_clamshell]
config_file = "hyprconfigs/docked.conf"
config_file_type = "static"

[profiles.docked_clamshell.conditions]
# Only match when lid is closed (requires --enable-lid-events flag)
lid_state = "Closed"

# Laptop must be connected (for lid detection)
[[profiles.docked_clamshell.conditions.required_monitors]]
name = "eDP-1"

# ASUS VG249 - vertical monitor on DP-2
[[profiles.docked_clamshell.conditions.required_monitors]]
name = "DP-2"

# LG UltraGear - main monitor on HDMI-A-1
[[profiles.docked_clamshell.conditions.required_monitors]]
name = "HDMI-A-1"

# ==============================================================================
# Profile 3: Extended Triple (All Monitors + Lid Open)
# ==============================================================================
# When: External monitors connected AND laptop lid is open
# Use case: Maximum screen real estate - laptop as third display
[profiles.extended_triple]
config_file = "hyprconfigs/extended.conf"
config_file_type = "static"

[profiles.extended_triple.conditions]
# Only match when lid is open
lid_state = "Opened"

# All three monitors must be connected
[[profiles.extended_triple.conditions.required_monitors]]
name = "eDP-1"

[[profiles.extended_triple.conditions.required_monitors]]
name = "DP-2"

[[profiles.extended_triple.conditions.required_monitors]]
name = "HDMI-A-1"

# ==============================================================================
# Profile 4: Dual Monitor (Laptop + LG, no vertical monitor)
# ==============================================================================
# When: Only eDP-1 + HDMI-A-1 connected (DP-2 not available)
# Use case: Partial dock setup without the vertical monitor
[profiles.dual_lg]
config_file = "hyprconfigs/dual_lg.conf"
config_file_type = "static"

[profiles.dual_lg.conditions]
lid_state = "Opened"

[[profiles.dual_lg.conditions.required_monitors]]
name = "eDP-1"

[[profiles.dual_lg.conditions.required_monitors]]
name = "HDMI-A-1"

# ==============================================================================
# Fallback Profile
# ==============================================================================
# When: No profile matches (e.g., unknown monitor configuration)
# This ensures Hyprland always has a valid monitor config
[fallback_profile]
config_file = "hyprconfigs/fallback.conf"
config_file_type = "static"
