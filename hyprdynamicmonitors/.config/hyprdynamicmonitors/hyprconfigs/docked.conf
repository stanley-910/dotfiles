# ==============================================================================
# Docked Clamshell Profile - External Monitors Only
# ==============================================================================
# Active when: External monitors connected + laptop lid closed
# Use case: Desk setup with laptop closed
#
# Layout: [DP-2 Vertical] [HDMI-A-1 Main]
#         Position 0,0    Position 1080,0

# Disable laptop screen when lid is closed
monitor=eDP-1,disable

# ASUS VG249 - LEFT monitor (vertical, 120Hz)
# Transform 1 = 90° clockwise rotation (portrait mode)
# Width becomes 1080px when rotated
monitor=DP-2,1920x1080@120,0x0,1.0,transform,1

# LG UltraGear - MAIN center monitor (1440p)
# Position starts at x=1080 (width of rotated DP-2)
monitor=HDMI-A-1,2560x1440@59.95,1080x0,1.0
