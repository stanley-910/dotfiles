# ==============================================================================
# Extended Triple Profile - All Monitors Active
# ==============================================================================
# Active when: External monitors connected + laptop lid open
# Use case: Maximum screen real estate
#
# Layout: [DP-2 Vertical] [HDMI-A-1 Main] [eDP-1 Laptop]
#         Position 0,0    Position 1080,0  Position 3640,360

# ASUS VG249 - LEFT monitor (vertical, 120Hz)
# Transform 1 = 90° clockwise rotation (portrait mode)
# Rotated dimensions: 1080w x 1920h
monitor=DP-2,1920x1080@120,0x0,1.0,transform,1

# LG UltraGear - CENTER/MAIN monitor (1440p)
# Position: x = 1080 (after vertical DP-2), y = 240 for alignment
monitor=HDMI-A-1,2560x1440@59.95,1080x240,1.0

# Laptop screen - RIGHT side
# Position: x = 1080 + 2560 = 3640 (after DP-2 + HDMI-A-1)
# y = 600 for alignment with other monitors
monitor=eDP-1,1920x1080@60,3640x600,1.0
