# ====================
# Command Reference
# ====================
# set (-g)      : Sets a global option for all sessions and windows
# setw (-g)     : Sets a window option (applies to windows and panes)
# set-option    : Same as 'set', just the long form
# bind          : Creates a key binding (same as bind-key)
# bind-key      : Long form of 'bind', creates a key binding
#
# Binding Flags:
# -r          : Makes binding repeatable (can hold key after prefix)
# -n          : Makes binding work without prefix key
# -T          : Specifies which key table to use (e.g., copy-mode-vi)
#
# Examples:
# set -g status-style ...     -> Affects status bar globally
# setw -g mode-keys vi        -> Sets vi mode for all windows
# set-option -g prefix ...    -> Sets prefix key globally
# bind -r k ...              -> Creates a repeatable key for holding down
# bind -n C-l ...           -> Creates binding that works without prefix

# ====================
# General Settings
# ====================
# Core settings
set-option -g history-limit 50000       # 50k lines scrollback by defualt
set -g escape-time 0                    # Immediate key sequence recognition
set -g mouse on                         # Enable mouse support
set -g focus-events on                  # Track window focus
set -g @scroll-speed-num-lines-per-scroll 1
set -g base-index 1                     # Start window numbering at 1
set -g renumber-windows on              # Renumber windows when one is closed
set-option -g display-time 3000         # Display time for messages -- 3 seconds

# Window settings
setw -g pane-base-index 1              # Start pane numbering at 1
setw -g mode-keys vi                    # Enable vi keys in copy mode
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Terminal settings
# True color + cursor COLOUR (OSC 12) / STYLE (DECSCUSR) passthrough to the outer
# terminal. Use -as to APPEND: a plain `set -g` REPLACES the whole list and wipes
# tmux's built-in ccolour/cstyle (which silently broke the vi-mode cursor colour
# from .zshrc). Matched against the OUTER terminal (client_termname); Ghostty
# reports xterm-ghostty — its terminfo omits Cs/Cr, so ccolour must be forced.
# extkeys tells tmux Ghostty supports extended (CSI-u) keys, so tmux requests
# them from Ghostty for its OWN bindings — without it, the C-S-h/j/k/l root binds
# below never see a distinct Ctrl+Shift and silently collapse to plain Ctrl.
set -as terminal-features ',xterm-ghostty:RGB:ccolour:cstyle:extkeys'
set -as terminal-features ',xterm-256color:RGB'  # truecolor if attached as xterm-256color
set -g allow-passthrough on                     # Allow external commands
set -g extended-keys on                         # Enable extended modified key reporting
set -g extended-keys-format csi-u              # Use CSI-u encoding for reliable modified keys

# Detect panes running Vim/Neovim so root key bindings can pass navigation keys
# through to the editor; the editor then falls back to tmux at its edge.
set -g @is_vim 'ps -o state= -o comm= -t "#{pane_tty}" | grep -iqE "^[^TXZ ]+ +(n?vim|view|lvim|vimdiff|nvimdiff)$"'

# Forward pane title (set by shell integration via OSC 2) to the outer terminal,
# so Ghostty's title bar shows the active command.
set -g set-titles on
set -g set-titles-string '#T'

# ====================
# Key Bindings
# ====================
# Prefix key
unbind C-b
set -g prefix M-Space                   # New prefix: Opt + Space
bind M-Space send-prefix                # Send prefix to nested tmux

# Reload config
bind R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Window management with special n/N toggle behavior
bind -r n next-window                     # Can prob remove this
bind -r N previous-window
# Alt+Shift+<letter> must be written M-S-<UPPER> (e.g. M-S-N), not the old M-N:
# with extkeys on (see terminal-features above) it arrives as an extended CSI-u
# key carrying an explicit Shift modifier, so M-N no longer matches. tmux keeps
# the base letter uppercased in this form — M-S-n and M-S-N are distinct keys.
bind -T root M-n next-window           # Alt+n for next window without prefix
bind -T root M-S-N previous-window     # Alt+Shift+n for previous window without prefix

bind -r L switch-client -l
bind -T root M-S-L switch-client -l    # Alt+Shift+l -> last client (M-S-L, not M-L, per extkeys note above)


# Other window management
bind -r q last-window                   # Repeatable last window
bind -T root M-q last-window                   # Repeatable last window (Opt+q is previous-window above)
bind -r r command-prompt "rename-window %%"
bind -r S command-prompt "rename-session %%"
bind c new-window -c "#{pane_current_path}"

# Pane management
bind -T root M-S-D last-pane                 # Opt+Shift+d toggles last visited pane (M-S-D, not M-D, per extkeys note)

# Session/Pane management
bind X command-prompt "kill-session"
bind ^x command-prompt "kill-pane"
bind -T root C-S-X display-message "Press 'x' to confirm, any other key to cancel" \; switch-client -T kill-pane
bind x display-message "Press 'x' again to kill pane" \; switch-client -T kill-pane
bind -T kill-pane x kill-pane

# Pane splitting (preserve current path)
bind \\ split-window -h -c "#{pane_current_path}"  # Split horizontal
bind - split-window -v -c "#{pane_current_path}"   # Split vertical

# Pane navigation (repeatable, can hold key)
bind -r h select-pane -L               # Move left
bind -r j select-pane -D               # Move down
bind -r k select-pane -U               # Move up
bind -r l select-pane -R               # Move right

# No-prefix smart Neovim window / tmux pane navigation. If the active pane is
# running Vim/Neovim, pass the key through; Neovim handles editor-window motion
# and falls back to tmux when already at the edge. Outside Vim, move tmux panes.
bind -T root C-S-H if-shell -b "#{E:@is_vim}" "send-keys C-S-H" "select-pane -L"
bind -T root C-S-J if-shell -b "#{E:@is_vim}" "send-keys C-S-J" "select-pane -D"
bind -T root C-S-K if-shell -b "#{E:@is_vim}" "send-keys C-S-K" "select-pane -U"
bind -T root C-S-L if-shell -b "#{E:@is_vim}" "send-keys C-S-L" "select-pane -R"

# Copy mode bindings (-T copy-mode-vi means these binds work in vi copy mode)
# When you press 'y' in copy mode, it will:
#   1. copy the selection to tmux buffer
#   2. keep the selection highlighted (no-clear)
#   3. stay in copy mode
# Enter copy mode with 'v' (alternative to prefix + [)
bind v copy-mode

# Direct search binding (enters copy mode and starts search)
bind / copy-mode \; send-keys ?
# bind ? copy-mode \; send-keys ?
bind [ copy-mode \; send-keys -X previous-prompt \; send-keys k
# https://tanutaran.medium.com/tmux-jump-between-prompt-output-with-osc-133-shell-integration-standard-84241b2defb5
bind -T copy-mode-vi [ send-keys -X previous-prompt \; send-keys k
bind -T copy-mode-vi ] send-keys -X next-prompt

# Copy mode bindings
bind -T copy-mode-vi v send -X begin-selection     # Begin selection
bind -T copy-mode-vi ^q send -X rectangle-toggle    # Toggle rectangle selection

set -g @yank_action 'copy-pipe'

# tmux-fingers
# prefix + , starts normal fingers mode; prefix + J starts jump mode.
set -g @fingers-key ,
set -g @fingers-jump-key J

# Quick no-prefix access. If the terminal eats Alt+punctuation, use prefix + , / J.
bind -n M-, run -b "#{@fingers-cli} start #{pane_id}"
bind -n M-. run -b "#{@fingers-cli} start #{pane_id} --mode jump"

# Focused tmux-fingers actions.
bind u run -b "#{@fingers-cli} start #{pane_id} --patterns url --main-action :open:"
bind e run -b "#{@fingers-cli} start #{pane_id} --patterns path --main-action 'xargs tmux new-window nvim'"

# Custom scripts

# History viewing (opens in a split so you can interact with the original pane)
bind H run-shell 'tmux split-window -h "tmux capture-pane -p -S - -t #{pane_id} | less +G"'


bind g display-popup -E '~/.config/scripts/git-menu'
# Source zshrc in all panes (excluding panes running long-running processes)
bind  Z  run 'panes=`tmux list-panes -s -F "##{pane_id}:##{pane_current_command}"`; \
              for pane_info in $panes; do \
                pane_id=${pane_info%%:*}; \
                command=${pane_info#*:}; \
                case "$command" in \
                  node|npm|yarn|docker|python|java|ruby|go|cargo|make|vim|nvim|nano|emacs) \
                    continue ;; \
                  *) \
                    tmux send -t $pane_id "source ~/.zshrc" Enter ;; \
                esac; \
              done'
bind f run-shell "tmux neww ~/.config/scripts/tmux-sessionizer"

# ====================
# Status Bar Styling
# ====================
set -g status-position bottom
set -g status-justify absolute-centre

# Colors and formatting
set -g status-style 'fg=color7 bg=default'
# set -g status-right '#[fg=colour1]%I:%M:%S#[fg=colour7] %m.%d.%Y'
set -g status-right ''
set -g status-left '[#S]'
set -g status-left-style 'fg=color8'
set -g status-right-length 50
set -g status-left-length 100

# Update status bar every second for live clock
set -g status-interval 1

# Window status formatting
setw -g window-status-current-style 'fg=colour1 bg=default bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-style 'fg=color8'
setw -g window-status-format ' #I:#[fg=white]#W#[fg=yellow]#F '
setw -g window-status-activity-style 'fg=yellow bg=default'
setw -g window-status-bell-style 'fg=red bg=default'

# ====================
# Plugins
# ====================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'Morantron/tmux-fingers'

set -g @fingers-backdrop-style "dim"
set -g @fingers-highlight-style "fg=red,bold"

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Plugin Manager Commands:
# prefix + I    -> Install plugins
# prefix + U    -> Update plugins
# prefix + alt + u -> Uninstall plugins
#


